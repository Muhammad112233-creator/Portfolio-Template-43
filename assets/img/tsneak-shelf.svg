<svg xmlns="http://www.w3.org/2000/svg" width="1035" height="229" viewBox="0 0 1035 229" fill="none" preserveAspectRatio="none">
  <defs>
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="229" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9f9f9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f9f9f9" stop-opacity="0"/>
    </linearGradient>
    <filter id="shelfNoise" x="0" y="0" width="1035" height="229" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="a"/>
      <feComponentTransfer in="a" result="b"><feFuncA type="discrete" tableValues="0 0.06 0.12 0.2 0.28 0.4 0.5"/></feComponentTransfer>
      <feComposite in="b" in2="SourceGraphic" operator="in" result="c"/>
      <feBlend in="SourceGraphic" in2="c" mode="normal"/>
    </filter>
  </defs>
  <rect width="1035" height="229" fill="url(#shelfGrad)" filter="url(#shelfNoise)"/>
  <rect x="0" y="0" width="1035" height="1" fill="#f9f9f9" fill-opacity="0.28"/>
</svg>
